<script>
(function () {
  var ICONE = document.querySelector('link[rel=apple-touch-icon]').href;
  var CABECA = Array.prototype.map.call(
    document.querySelectorAll('meta[name^=apple], meta[name=mobile-web-app-capable], meta[name=theme-color], link[rel*=icon]'),
    function (n) { return n.outerHTML; }).join('');

  function lerHash() {
    var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (par) {
      var i = par.indexOf('='); if (i > 0) h[par.slice(0, i)] = decodeURIComponent(par.slice(i + 1));
    });
    return h.u && h.k ? { u: h.u, k: h.k } : null;
  }
  function lerSalvo() { try { return JSON.parse(localStorage.getItem('carroEmDia') || 'null'); } catch (e) { return null; } }
  function salvar(c) {
    try { localStorage.setItem('carroEmDia', JSON.stringify(c)); } catch (e) {}
    // O link guarda os dados: o ícone da tela inicial já abre configurado.
    history.replaceState(null, '', location.pathname + '#u=' + encodeURIComponent(c.u) + '&k=' + encodeURIComponent(c.k));
  }

  function chamar(c, fn, arg) {
    return fetch(c.u, { method: 'POST', body: JSON.stringify({ fn: fn, arg: arg === undefined ? null : arg, k: c.k }) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Sem conexão com o app. Confira a internet.'); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro || 'Erro no app'); return j.v; });
  }

  // Substitui o google.script.run: cada chamada vira um POST para o app com a chave.
  function ponte(c) {
    return '<script>(function(){var U=' + JSON.stringify(c.u) + ',K=' + JSON.stringify(c.k) + ';' +
      'function api(fn,arg){return fetch(U,{method:"POST",body:JSON.stringify({fn:fn,arg:arg===undefined?null:arg,k:K})})' +
      '.then(function(r){return r.json()},function(){throw new Error("Sem conexão com o app. Confira a internet.")})' +
      '.then(function(j){if(!j.ok)throw new Error(j.erro||"Erro no app");return j.v})}' +
      'function run(ok,falha){var o={withSuccessHandler:function(f){return run(f,falha)},withFailureHandler:function(f){return run(ok,f)}};' +
      'return new Proxy(o,{get:function(t,p){if(p in t)return t[p];return function(arg){api(p,arg).then(function(v){ok&&ok(v)},function(e){falha&&falha(e)})}}})}' +
      'window.google={script:{run:run()}};})();<\/script>';
  }

  function abrir(c) {
    chamar(c, 'ui').then(function (html) {
      salvar(c);
      html = html.replace(/<head>/i, '<head>' + CABECA + ponte(c));
      document.open(); document.write(html); document.close();
    }, function (e) { pedir(c, e.message); });
  }

  function pedir(c, erro) {
    var t = document.getElementById('tela');
    t.innerHTML = '<img alt="" src="' + ICONE + '"><h1>Carro em Dia</h1>' +
      '<p>Só na primeira vez: cole o link do app e a chave que chegaram no seu e-mail.</p>' +
      (erro ? '<p class="erro"></p>' : '') +
      '<label for="u">Link do app</label><input id="u" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/.../exec">' +
      '<label for="k">Chave</label><input id="k" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<button id="ok">Entrar</button>';
    if (erro) t.querySelector('.erro').textContent = erro;
    if (c) { t.querySelector('#u').value = c.u; t.querySelector('#k').value = c.k; }
    t.querySelector('#ok').onclick = function () {
      var u = t.querySelector('#u').value.trim(), k = t.querySelector('#k').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { pedir({ u: u, k: k }, 'O link do app precisa começar com https://script.google.com e terminar em /exec.'); return; }
      if (!k) { pedir({ u: u, k: k }, 'Cole a chave.'); return; }
      this.disabled = true; this.textContent = 'Abrindo…';
      abrir({ u: u, k: k });
    };
  }

  var c = lerHash() || lerSalvo();
  if (c) abrir(c); else pedir(null);
})();
</script>
